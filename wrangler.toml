# Cloudflare Worker config (Workers Builds runs `npx wrangler deploy` with this file)
# "name" must match the Worker's name in the Cloudflare dashboard.
name = "scorenest-scores"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[r2_buckets]]
binding = "SCORES"
bucket_name = "scorenest-scores"

[vars]
# Gemini model used for PDF / image transcription.
GEMINI_MODEL = "gemini-3.8-flash"

# Secrets (dashboard → your Worker → Settings → Variables and Secrets → Add → type "Secret"):
#   APP_PASSWORD       – password to sign in (leave unset = open to anyone with the URL)
#   SESSION_SECRET     – any long random string
#   GEMINI_API_KEY  – enables AI transcription of PDFs and photos
